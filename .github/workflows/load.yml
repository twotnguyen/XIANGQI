name: Load lane (manual)

# ISSUE-030 measures capacity (p95 < 100ms with 10 rooms / 70 concurrent sockets).
# Spec 08 allows the load/benchmark lane to be a separate, manually dispatched
# workflow on adequate hardware: a shared 2-core hosted runner measured p95
# 405ms, which says nothing about the product's capacity. Run this on a
# reference machine and attach the output to the issue evidence.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this load run is being executed
        required: false
        default: manual capacity check

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "::warning::supabase start failed (attempt ${attempt}); retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Write .env.test from the local stack
        run: |
          cp .env.test.example .env.test
          supabase status -o env > /tmp/supabase.env
          set -a && . /tmp/supabase.env && set +a
          sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=${API_URL}|" .env.test
          sed -i "s|^SUPABASE_PUBLISHABLE_KEY=.*|SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}|" .env.test
          sed -i "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=${SECRET_KEY}|" .env.test

      - name: Concurrency and load lane (real sockets)
        run: pnpm test:load

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
