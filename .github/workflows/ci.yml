name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".env.example"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".env.example"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  checks:
    name: Fast Checks & Build (full tests on main)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR source branch for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::Chỉ cho phép mở Pull Request vào 'main' từ nhánh 'develop'. Nhánh '${HEAD_REF}' không được merge trực tiếp vào 'main'."
          gh pr comment "$PR_NUMBER" --body "⚠️ **Quy chuẩn Git Flow của dự án XIANGQI:**

          Nhánh **\`main\`** chỉ nhận Pull Request từ nhánh **\`develop\`**.
          Các nhánh tính năng/sửa lỗi (\`${HEAD_REF}\`) phải được mở PR vào nhánh **\`develop\`** trước.

          👉 Vui lòng đổi Base Branch của PR này từ \`main\` sang \`develop\`." || true
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check CI scope rules
        run: node .github/scripts/ci-scope.mjs --self-test
      - id: filter
        name: Detect release gate and affected builds
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_BEFORE: ${{ github.event.before }}
          CI_REF: ${{ github.ref }}
        run: node .github/scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Core tests with coverage
        if: steps.filter.outputs.full == 'true'
        run: pnpm test:core --bail 1
      - name: Unit tests without repeating core
        if: steps.filter.outputs.full == 'true'
        run: pnpm test:unit --exclude 'tests/packages/xiangqi-core/**' --bail 1
      - name: Build both applications
        if: steps.filter.outputs.web == 'true' && steps.filter.outputs.server == 'true'
        run: pnpm build
      - name: Build web and its dependencies
        if: steps.filter.outputs.web == 'true' && steps.filter.outputs.server != 'true'
        run: pnpm build:web
      - name: Build server and its dependencies
        if: steps.filter.outputs.server == 'true' && steps.filter.outputs.web != 'true'
        run: pnpm build:server

  db-integration:
    name: Database Integration Tests
    needs: checks
    if: needs.checks.outputs.full == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_auth_test
          POSTGRES_USER: auth_test_admin
          POSTGRES_PASSWORD: isolated-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test_admin -d xiangqi_auth_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
      realtime-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_realtime_test
          POSTGRES_USER: realtime_test_admin
          POSTGRES_PASSWORD: isolated-realtime-ci-test
        ports:
