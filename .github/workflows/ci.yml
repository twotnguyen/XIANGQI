name: CI
on:
  push:
    branches: [main, develop, "feat/XIAN-**", "fix/XIAN-**", "chore/XIAN-**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_auth_test
          POSTGRES_USER: auth_test_admin
          POSTGRES_PASSWORD: isolated-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test_admin -d xiangqi_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      realtime-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_realtime_test
          POSTGRES_USER: realtime_test_admin
          POSTGRES_PASSWORD: isolated-realtime-ci-test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U realtime_test_admin -d xiangqi_realtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      login-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_login_test
          POSTGRES_USER: login_test_admin
          POSTGRES_PASSWORD: isolated-login-ci-test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U login_test_admin -d xiangqi_login_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      schema-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_schema_test
          POSTGRES_USER: schema_test_admin
          POSTGRES_PASSWORD: isolated-schema-ci-test
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U schema_test_admin -d xiangqi_schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      google-guest-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: google_guest_test
          POSTGRES_USER: google_guest_test_admin
          POSTGRES_PASSWORD: isolated-google-guest-ci-test
        ports:
          - 55445:5432
        options: >-
          --health-cmd "pg_isready -U google_guest_test_admin -d google_guest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOGLE_GUEST_TEST_DATABASE_URL: postgresql://google_guest_test_admin:isolated-google-guest-ci-test@127.0.0.1:55445/google_guest_test
      SCHEMA_TEST_DATABASE_URL: postgresql://schema_test_admin:isolated-schema-ci-test@127.0.0.1:55443/xiangqi_schema_test
      LOGIN_TEST_DATABASE_URL: postgresql://login_test_admin:isolated-login-ci-test@localhost:5434/xiangqi_login_test
      AUTH_TEST_DATABASE_URL: postgresql://auth_test_admin:isolated-ci-test@localhost:5432/xiangqi_auth_test
      REALTIME_TEST_DATABASE_URL: postgresql://realtime_test_admin:isolated-realtime-ci-test@localhost:5433/xiangqi_realtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:core
      - run: pnpm build
