name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Scope, Lint, Typecheck & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.filter.outputs.full }}
      code: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.server == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR source branch for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::main chỉ nhận PR từ develop trong chính repository này."
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Khi không có thay đổi web/server, pnpm install bị bỏ qua và thư mục store chưa tồn tại:
      # bước lưu cache của setup-node khi đó báo lỗi làm job (và check bắt buộc) đỏ.
      - name: Ensure pnpm store directory exists
        run: mkdir -p "$(pnpm store path --silent)"
      - name: Check CI scope rules
        run: node .github/scripts/ci-scope.mjs --self-test
      - id: filter
        name: Detect release gate and affected builds
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.web == 'true' || steps.filter.outputs.server == 'true'
      - name: Run lint and typecheck concurrently
        if: steps.filter.outputs.web == 'true' || steps.filter.outputs.server == 'true'
        run: |
          pnpm lint &
          PID_LINT=$!
          pnpm typecheck &
          PID_TYPE=$!
          wait $PID_LINT
          wait $PID_TYPE
      - name: Build both applications
        if: steps.filter.outputs.web == 'true' && steps.filter.outputs.server == 'true'
        run: pnpm build
      - name: Build web and its dependencies
        if: steps.filter.outputs.web == 'true' && steps.filter.outputs.server != 'true'
        run: pnpm build:web
      - name: Build server and its dependencies
        if: steps.filter.outputs.server == 'true' && steps.filter.outputs.web != 'true'
        run: pnpm build:server

  unit-tests:
    name: Unit & Core Tests
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core tests with coverage
        run: pnpm test:core --bail 1
      - name: Unit tests without repeating core
        run: pnpm test:unit --exclude 'tests/packages/xiangqi-core/**' --bail 1

  db-integration:
    name: Database Integration Tests (${{ matrix.shard }}/6)
    needs: checks
    if: needs.checks.outputs.full == 'true' && needs.checks.outputs.code == 'true'
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      XQ_PG_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/server-shards.mjs --self-test
      - run: node tests/server/db-scope.mjs --self-test
      - run: node .github/scripts/server-shards.mjs --run ${{ matrix.shard }}

  db-gate:
    name: Database Integration Gate
    needs: [checks, db-integration, unit-tests]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify all database and unit test shards passed
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error::Kiểm tra nguồn PR, phạm vi hoặc build đã thất bại."
            exit 1
          fi
          if [ "${{ needs.checks.outputs.code }}" = "false" ]; then
            echo "PR chỉ sửa tài liệu: không cần chạy unit/database/build."
            exit 0
          fi
          if [ "${{ needs.db-integration.result }}" != "success" ] || [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::Một hoặc nhiều bài kiểm thử database hoặc unit test đã thất bại."
            exit 1
          fi
          echo "Toàn bộ database test shards và unit tests đã pass thành công."
