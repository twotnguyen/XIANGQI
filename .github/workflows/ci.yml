      room-runtime-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_room_runtime_test
          POSTGRES_USER: room_runtime_test_admin
          POSTGRES_PASSWORD: isolated-room-runtime-ci-test
        ports:
          - 55452:5432
        options: >-
          --health-cmd "pg_isready -U room_runtime_test_admin -d xiangqi_room_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROOM_RUNTIME_TEST_DATABASE_URL: postgresql://room_runtime_test_admin:isolated-room-runtime-ci-test@127.0.0.1:55452/xiangqi_room_runtime_test
      MEMBER_REALTIME_TEST_DATABASE_URL: postgresql://member_realtime_test_admin:isolated-member-realtime-ci-test@127.0.0.1:55450/xiangqi_member_realtime_test
      CLOCK_PORT_TEST_DATABASE_URL: postgresql://clock_test_admin:isolated-clock-port-ci-test@127.0.0.1:55451/xiangqi_clock_port_test
      ROOM_TRANSACTION_TEST_DATABASE_URL: postgresql://room_transaction_test_admin:isolated-room-transactions-ci-test@127.0.0.1:55449/xiangqi_room_transactions_test
      CLOCK_TEST_DATABASE_URL: postgresql://clock_test_admin:isolated-clock-ci-test@127.0.0.1:55448/xiangqi_clock_test
      MATCH_TEST_DATABASE_URL: postgresql://match_test_admin:isolated-match-ci-test@127.0.0.1:55447/xiangqi_match_test
      ROOM_TEST_DATABASE_URL: postgresql://room_test_admin:isolated-room-ci-test@127.0.0.1:55446/xiangqi_room_test
      GOOGLE_GUEST_TEST_DATABASE_URL: postgresql://google_guest_test_admin:isolated-google-guest-ci-test@127.0.0.1:55445/google_guest_test
      SCHEMA_TEST_DATABASE_URL: postgresql://schema_test_admin:isolated-schema-ci-test@127.0.0.1:55443/xiangqi_schema_test
      LOGIN_TEST_DATABASE_URL: postgresql://login_test_admin:isolated-login-ci-test@localhost:5434/xiangqi_login_test
      AUTH_TEST_DATABASE_URL: postgresql://auth_test_admin:isolated-ci-test@localhost:5432/xiangqi_auth_test
      REALTIME_TEST_DATABASE_URL: postgresql://realtime_test_admin:isolated-realtime-ci-test@localhost:5433/xiangqi_realtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --no-file-parallelism
      - run: pnpm test:core
      - run: pnpm build
