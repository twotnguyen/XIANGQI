          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      google-guest-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: google_guest_test
          POSTGRES_USER: google_guest_test_admin
          POSTGRES_PASSWORD: isolated-google-guest-ci-test
        ports:
          - 55445:5432
        options: >-
          --health-cmd "pg_isready -U google_guest_test_admin -d google_guest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      room-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_room_test
          POSTGRES_USER: room_test_admin
          POSTGRES_PASSWORD: isolated-room-ci-test
        ports:
          - 55446:5432
        options: >-
          --health-cmd "pg_isready -U room_test_admin -d xiangqi_room_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      match-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_match_test
          POSTGRES_USER: match_test_admin
          POSTGRES_PASSWORD: isolated-match-ci-test
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U match_test_admin -d xiangqi_match_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clock-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_clock_test
          POSTGRES_USER: clock_test_admin
          POSTGRES_PASSWORD: isolated-clock-ci-test
        ports:
          - 55448:5432
        options: >-
          --health-cmd "pg_isready -U clock_test_admin -d xiangqi_clock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      room-transactions-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_room_transactions_test
          POSTGRES_USER: room_transaction_test_admin
          POSTGRES_PASSWORD: isolated-room-transactions-ci-test
        ports:
          - 55449:5432
        options: >-
          --health-cmd "pg_isready -U room_transaction_test_admin -d xiangqi_room_transactions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clock-port-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_clock_port_test
          POSTGRES_USER: clock_test_admin
          POSTGRES_PASSWORD: isolated-clock-port-ci-test
        ports:
          - 55451:5432
        options: >-
          --health-cmd "pg_isready -U clock_test_admin -d xiangqi_clock_port_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      member-realtime-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xiangqi_member_realtime_test
          POSTGRES_USER: member_realtime_test_admin
          POSTGRES_PASSWORD: isolated-member-realtime-ci-test
        ports:
          - 55450:5432
        options: >-
          --health-cmd "pg_isready -U member_realtime_test_admin -d xiangqi_member_realtime_test"
