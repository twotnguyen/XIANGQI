name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast static analysis & unit test lane (zero external services needed).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  # ISSUE-006 lane: real migrations, constraints and RLS on the local Supabase stack.
  # The lane fails (it never skips) when the stack or its env is missing.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The image pull is the flakiest step on a hosted runner: retry before failing.
      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt ${attempt}); retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      # .env.test is gitignored: build it from the committed local template plus the
      # Publishable/Secret keys `supabase status` prints for this stack.
      - name: Write .env.test from the local stack
        run: |
          cp .env.test.example .env.test
          supabase status -o env > /tmp/supabase.env
          set -a && . /tmp/supabase.env && set +a
          sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=${API_URL}|" .env.test
          sed -i "s|^SUPABASE_PUBLISHABLE_KEY=.*|SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}|" .env.test
          sed -i "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=${SECRET_KEY}|" .env.test
          echo "VITE_API_URL=http://localhost:3001" >> .env.test
          echo "VITE_SUPABASE_URL=${API_URL}" >> .env.test
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" >> .env.test
          echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}" >> .env.test
      - name: Install Playwright Chromium for media spike
        run: pnpm exec playwright install --with-deps chromium

      - name: Integration lane (real Postgres + Auth)
        run: pnpm test:integration

      # ISSUE-030: 10 rooms / 70 concurrent Socket.IO clients / 10 parallel moves.
      # Runs on its own step so no other suite competes for the runner's cores.
      - name: Concurrency and load lane (real sockets)
        run: pnpm test:load

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  # ISSUE-024 lane: real LiveKit SFU. The media spike asserts real room create/delete
  # against the SFU and a DB-backed policy, so both services must be up or the lane fails.
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The image pull is the flakiest step on a hosted runner: retry before failing.
      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt ${attempt}); retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Write .env.test from the local stack
        run: |
          cp .env.test.example .env.test
          supabase status -o env > /tmp/supabase.env
          set -a && . /tmp/supabase.env && set +a
          sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=${API_URL}|" .env.test
          sed -i "s|^SUPABASE_PUBLISHABLE_KEY=.*|SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}|" .env.test
          sed -i "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=${SECRET_KEY}|" .env.test
          echo "VITE_API_URL=http://localhost:3001" >> .env.test
          echo "VITE_SUPABASE_URL=${API_URL}" >> .env.test
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" >> .env.test
          echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}" >> .env.test

      - name: Start LiveKit SFU (dev mode)
        run: docker run -d --name livekit --network host livekit/livekit-server --dev

      # The spike provisions its own SFU (loopback candidates enabled) on free ports, so
      # the livekit-server binary must be on PATH; it fails loudly when it is missing.
      - name: Expose the livekit-server binary
        run: |
          docker cp livekit:/livekit-server /usr/local/bin/livekit-server
          chmod +x /usr/local/bin/livekit-server
          livekit-server --version

      - name: Wait for LiveKit readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7880/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::LiveKit SFU is not reachable on 127.0.0.1:7880 after 30s"
          docker logs livekit || true
          exit 1
      - name: Install Playwright Chromium for media spike
        run: pnpm exec playwright install --with-deps chromium

      - name: Media lane (real SFU)
        env:
          LIVEKIT_BINARY: /usr/local/bin/livekit-server
        run: pnpm test:media

      - name: Stop LiveKit SFU
        if: always()
        run: docker rm -f livekit || true

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  # E2E Playwright lane: full browser journey against live backend & local Supabase.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The image pull is the flakiest step on a hosted runner: retry before failing.
      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt ${attempt}); retrying"
            supabase stop --no-backup || true
            sleep 15
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Write .env.test from the local stack
        run: |
          cp .env.test.example .env.test
          supabase status -o env > /tmp/supabase.env
          set -a && . /tmp/supabase.env && set +a
          sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=${API_URL}|" .env.test
          sed -i "s|^SUPABASE_PUBLISHABLE_KEY=.*|SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}|" .env.test
          sed -i "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=${SECRET_KEY}|" .env.test
          echo "VITE_API_URL=http://localhost:3001" >> .env.test
          echo "VITE_SUPABASE_URL=${API_URL}" >> .env.test
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" >> .env.test
          echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}" >> .env.test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
