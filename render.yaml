services:
  - type: web
    name: xiangqi-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm --filter @xiangqi/server... build
    startCommand: pnpm --filter @xiangqi/server start
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      # Mọi origin web công khai (scheme+host+port), không wildcard; web gọi API qua /api cùng origin.
      - key: CORS_ORIGINS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
